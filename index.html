function areaLabelText(name) {

}
function areaLabel(pos, name, color) {
  const saved = savedAreaLabelPositions[name];
  const usePos = saved ? [saved.lat, saved.lon] : pos;
  const displayName = areaLabelText(name);
  const label = L.marker(usePos, {
    interactive:true,
    draggable:true,
    pane:'areaLabels',
    zIndexOffset:10000,
    icon:L.divIcon({className:'', html:`<div class="area-label" style="color:${color}">${displayName}</div>`, iconSize:[150,44], iconAnchor:[75,22]})
  }).addTo(map);
  label.on('click', e => L.DomEvent.stopPropagation(e));
  label.on('dragstart', e => L.DomEvent.stopPropagation(e));
  label.on('dragend', () => {
    const ll = label.getLatLng();
    savedAreaLabelPositions[name] = {lat:+ll.lat.toFixed(7), lon:+ll.lng.toFixed(7)};
    saveAreaLabelPositions();
  });
  return label;
}

function savePoints(){ localStorage.setItem('baltimoreCustomPoints', JSON.stringify(points)); }
function clearSelection(){
  if (selectedIndex === null) return;
  selectedIndex = null;
  pointMarkers.forEach((m, idx) => m.setIcon(markerIcon(points[idx].kind, false)));
  els.name.value = '';
  els.hint.textContent = 'Selection cleared. Click an icon to edit it, or use Add point.';
}
function selectPoint(i){
  selectedIndex = i;
  pointMarkers.forEach((m, idx) => m.setIcon(markerIcon(points[idx].kind, idx === i)));
  els.name.value = points[i].name;
  els.icon.value = points[i].kind;
  els.hint.textContent = 'Selected: ' + points[i].name + '. Drag it, edit fields, save, or delete.';
}
function renderPoints(){
  pointMarkers.forEach(m => map.removeLayer(m));
  pointMarkers = [];
  points.forEach((p, i) => {
    const m = L.marker([p.lat, p.lon], {draggable:true, icon:markerIcon(p.kind, i === selectedIndex)}).addTo(map);
    m.bindTooltip(p.name, {direction:'top', offset:[0,-12], opacity:1, sticky:true, className:'feature-tip'});
    m.on('click', (e) => { L.DomEvent.stopPropagation(e); selectPoint(i); });
    m.on('dragend', () => {
      const ll = m.getLatLng();
      points[i].lat = +ll.lat.toFixed(7); points[i].lon = +ll.lng.toFixed(7);
      savePoints(); selectPoint(i);
    });
    pointMarkers.push(m);
  });
}
renderPoints();

els.add.onclick = () => {
  addMode = true;
  selectedIndex = null;
  pointMarkers.forEach((m, idx) => m.setIcon(markerIcon(points[idx].kind, false)));
  els.hint.textContent = 'Add mode: click the map where the new point should go.';
};
map.on('click', (e) => {
  if (!addMode) { clearSelection(); return; }
  const name = els.name.value.trim() || 'New point';
  points.push({name, kind:els.icon.value, lat:+e.latlng.lat.toFixed(7), lon:+e.latlng.lng.toFixed(7)});
  selectedIndex = points.length - 1;
  addMode = false;
  savePoints(); renderPoints(); selectPoint(selectedIndex);
});
els.save.onclick = () => {
  if (selectedIndex === null) { els.hint.textContent = 'Select a point first, or use Add point.'; return; }
  points[selectedIndex].name = els.name.value.trim() || points[selectedIndex].name;
  points[selectedIndex].kind = els.icon.value;
  savePoints(); renderPoints(); selectPoint(selectedIndex);
};
els.del.onclick = () => {
  if (selectedIndex === null) { els.hint.textContent = 'Select a point to delete.'; return; }
  const removed = points[selectedIndex].name;
  points.splice(selectedIndex, 1);
  selectedIndex = null;
  els.name.value = '';
  savePoints(); renderPoints();
  els.hint.textContent = 'Deleted: ' + removed;
};
els.reset.onclick = () => {
  if (!confirm('Reset all points to the original version?')) return;

  els.hint.textContent = 'Reset to original points.';
};
els.export.onclick = () => {
  const blob = new Blob([JSON.stringify(points, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'baltimore_custom_points.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 500);
};

function downloadCurrentMapHtml(){
  savePoints();
  saveAreaLabelPositions();
  const clone = document.documentElement.cloneNode(true);
  const clonedMap = clone.querySelector('#map');
  if (clonedMap) {
    clonedMap.innerHTML = '';
    clonedMap.setAttribute('id', 'map');
    clonedMap.removeAttribute('class');
    clonedMap.removeAttribute('style');
    clonedMap.removeAttribute('tabindex');
  }
  let html = '<!doctype html>\n' + clone.outerHTML;
  const pointsLiteral = JSON.stringify(points, null, 2);
  const labelPositionsLiteral = JSON.stringify(savedAreaLabelPositions, null, 2);
  html = html.replace(
    /const savedAreaLabelPositions = JSON\.parse\(localStorage\.getItem\('baltimoreAreaLabelPositions'\) \|\| '\{\}'\);/,
    'const savedAreaLabelPositions = ' + labelPositionsLiteral + ';'
  );
  html = html.replace(
    /let points = JSON\.parse\(localStorage\.getItem\('baltimoreCustomPoints'\) \|\| 'null'\) \|\| originalPoints;/,
    'let points = ' + pointsLiteral + ';'
  );
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'Baltimore_Map_saved_' + stamp + '.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 800);
  els.hint.textContent = 'Downloaded a self-contained HTML copy with your current points and label positions.';
}
